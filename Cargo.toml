[package]
name = "txtfrmt"
version = "0.1.0"
edition = "2024"
description = "Background text formatter daemon with global hotkeys"
authors = ["bloodulon@proton.me"]
license = "MIT"

[[bin]]
name = "txtfrmt"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
dirs = "6.0"
ratatui = "0.29"
crossterm = "0.29"
unicode-segmentation = "1.12"
tokio = { version = "1.43", features = ["rt-multi-thread", "sync", "time", "macros"] }
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
enigo = "0.3"
winapi = { version = "0.3", features = ["winuser", "wincon", "errhandlingapi"] }
arboard = "3.5"
